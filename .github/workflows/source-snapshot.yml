name: NetPin source snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive only tracked source files
        run: git archive --format=tar.gz --output=netpin-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: netpin-source-snapshot
          path: netpin-source.tar.gz
          retention-days: 3
