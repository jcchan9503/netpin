name: NetPin toolchain
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/toolchain.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build and runtime dependencies
        run: |
          mkdir -p .ci-toolchain
          cd .ci-toolchain
          npm init -y
          npm install --no-audit --no-fund electron@44.3.0 net-snmp@3.29.1 electron-builder@26.0.12
          cd ..
          tar -czf netpin-toolchain-linux-x64.tar.gz -C .ci-toolchain node_modules package-lock.json
          sha256sum netpin-toolchain-linux-x64.tar.gz > netpin-toolchain-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: netpin-toolchain-linux-x64
          path: |
            netpin-toolchain-linux-x64.tar.gz
            netpin-toolchain-linux-x64.sha256
          retention-days: 3
          compression-level: 0
