name: NetPin toolchain
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/toolchain.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build and runtime dependencies
        run: |
          mkdir -p netpin-toolchain
          cd netpin-toolchain
          cat > package.json <<'JSON'
          {"name":"netpin","version":"0.1.0","private":true,"license":"UNLICENSED","type":"module","engines":{"node":">=22.16.0"},"dependencies":{"net-snmp":"3.29.1"},"devDependencies":{"electron":"44.3.0","electron-builder":"26.0.12"}}
          JSON
          npm install --no-audit --no-fund
          node -e "console.log(require('electron'))"
          cd ..
          tar -czf netpin-toolchain-linux-x64.tar.gz -C netpin-toolchain node_modules package-lock.json
          sha256sum netpin-toolchain-linux-x64.tar.gz > netpin-toolchain-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: netpin-toolchain-linux-x64
          path: |
            netpin-toolchain-linux-x64.tar.gz
            netpin-toolchain-linux-x64.sha256
          retention-days: 3
          compression-level: 0
