<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>NetPin · 网踪</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="states.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">N<span>•</span></span><div>NetPin<small>网踪 · IP 管理</small></div></div>
    <div class="nav-label">工作空间</div>
    <nav>
      <button data-nav="overview" class="selected"><span>▦</span>网络概览</button>
      <button data-nav="subnets"><span>▤</span>IP 地址台账</button>
      <button data-nav="devices"><span>▥</span>设备与端口</button>
      <button data-nav="history"><span>◷</span>变更记录</button>
      <button data-nav="settings"><span>⚙</span>凭据与设置</button>
    </nav>
    <div class="sidebar-bottom"><div class="status-dot"></div>本地数据 · 离线运行<p>只读发现，不修改网络设备</p><button id="mode" class="quiet">进入示例空间 ↗</button><small>v0.1.0 · IPv4</small></div>
  </aside>
  <main>
    <header><div id="breadcrumb">工作空间 / 网络概览</div><form id="global-search"><span>⌕</span><input aria-label="全局搜索" placeholder="搜索已发现的 IP、MAC、用途…"><kbd>Enter</kbd></form><span id="environment" class="badge neutral">本地工作区</span></header>
    <div id="demo-banner" hidden>示例空间 · 以下为合成设备与地址，和真实台账隔离，不发送任何网络请求。</div>
    <div id="taskbar" hidden></div>
    <section id="content" aria-live="polite"><div class="empty">正在打开本地数据库…</div></section>
    <footer><span>NetPin · 把 IP、MAC 与端口关联起来</span><span>未发现使用证据 ≠ 地址可以分配</span></footer>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="bridge.js"></script><script type="module" src="app.js"></script>
</body></html>
